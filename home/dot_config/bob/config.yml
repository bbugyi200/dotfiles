# Bullet properties offered by the Obsidian "Set bullet property" picker (Ctrl+Shift+P).
# `values` is the literal string `date` (YYYY-MM-DD), the literal string `local_task_id`
# (the identifier of an open #task chosen from the current file), the literal string
# `priority` (a P-level that also rolls a random date into another date property), or a
# list of allowed values.
timezone: America/New_York

properties:
  - name: scheduled
    values: date
  - name: dependsOn
    values: local_task_id
  # Choosing a level writes `[priority:: <value>]` and rolls a random date into the
  # property named by `schedules`, drawn inclusively from that level's day window.
  # A task with no priority field is implicitly P0: do it now, no roll.
  #
  # `value` is what lands in the note and MUST stay one of Obsidian Tasks' priority
  # names (highest, high, medium, low, lowest). Tasks-format parsers read trailing
  # inline fields right to left and stop at the first one they do not recognize, so an
  # invented value such as `P2` would also hide every `[scheduled:: ]`, `[id:: ]`, and
  # `[dependsOn:: ]` field to its left from Obsidian Tasks, `bob query`, and the dash.
  # `label` is what the picker shows.
  - name: priority
    values: priority
    schedules: scheduled
    # Ctrl+Enter on `scheduled` takes the recommended roll. Each level allows `rolls`
    # same-level rolls (read from the task's Schedule Log); the next recommended roll
    # decays the task one level (P2 → P3), and past the last level it cancels it.
    # `decay: false` makes Ctrl+Enter a plain same-level roll that never decays.
    decay:
      rolls: 1
    levels:
      - label: P1
        value: high
        min_days: 3
        max_days: 8
        # rolls: 3   # optional: this level's own roll limit
      - label: P2
        value: medium
        min_days: 9
        max_days: 31
      - label: P3
        value: low
        min_days: 32
        max_days: 100
      - label: P4
        value: lowest
        min_days: 101
        max_days: 365

highlights:
  # Each host drains its own xlib/ with bob ref scan --intake-only.
  # `bob ref create --listen` (and `clip --listen`) narrates the target with
  # `sase listen render ...`, which must write MP3 audio to {audio}; bob binds it
  # as the PDF's companion audio. bob passes {target} {pdf} {audio} {title} as
  # single arguments to `sase` itself — do not quote them. A direct
  # `sase-listen render ...` setting migrates automatically; wrappers, shell
  # programs, chains, pipelines, redirections, and expansions are rejected.
  # This managed setup uses the SASE plugin (`sase listen render`). The
  # plugin's feed.auto_publish publishes the episode. See
  # docs/highlights-create.md in bob-cli.
  listen_command: sase listen render {target} -e full -o {audio}
  # Ask Highlights (macOS file coordination) to save an open PDF before bob
  # rewrites its page-1 marker, then reload it in place. Inert off macOS. See
  # "PDFs open in Highlights" in bob-cli docs/highlights-ref-sync.md.
  coordinate_pdf_writes: true
  # Link each task created from a Highlights `#task` annotation back to its
  # reference's reading task on the new task's 🪢 LINKS line ("<task> inspired by
  # <reading task>"). Unset links nothing. See "Relation to the reading task" in
  # bob-cli docs/highlights-ref-sync.md.
  annotation_task_relation: inspired by

# `bob gkeep` drains the Google Keep inbox into gkeep_inbox.md as Obsidian
# tasks; see `bob gkeep --help` and docs/gkeep.md in bob-cli. Run
# `bob gkeep login` once to store the master token, then `bob gkeep doctor`
# to diagnose the setup.
gkeep:
  email: bryanbugyi34@gmail.com
  # token_command: pass show gkeep/master_token
  # token_store_command: pass insert -m -f gkeep/master_token
  # device_id: 3f9c0a1b2c3d4e5f # optional hex; default derived from email
  # target: gkeep_inbox.md # optional; vault-relative
  # timeout_secs: 300 # optional adapter timeout

# `bob gcal` projects Google Calendar events onto today's daily note as Event
# Tasks; see `bob gcal --help` and docs/gcal.md in bob-cli. Uncomment to
# enable, then run `bob gcal login` once and `bob gcal doctor` to diagnose
# the setup. Only the host named by `writer` may sync; the Mac syncs when
# you run `bob gcal sync`, and Ledger Tools runs it once when today's note
# is created.
# gcal:
#   account: bryanbugyi34@gmail.com # optional when gog holds exactly one account
#   writer: kellys-macbook-pro # the one host label allowed to sync
#   root: meet # default [root::] for Event Tasks
#   calendars: # default: [primary]
#     - id: primary
#     # - id: <calendar id from `bob gcal calendars`>
#     #   root: body
#   colors: {} # e.g. {tomato: job, sage: body}
#   tentative: context # context | task
#   timeout_secs: 60 # optional gog request timeout

# Daily review cadence (`bob freshness list`, ledger-tools walk tiers, nav
# refresh row); see `docs/freshness.md` §2 in bob-cli. The block is optional:
# a missing block means these defaults. Invalid values are a config error for
# `bob freshness` (exit 2); ledger-tools falls back to defaults marked invalid.
freshness:
  # PRE/POST checklist stages (bob-cli docs/freshness.md §4). A stage is a tag written
  # right after #pre/#post (`#task #gtd #pre #browser`). Stages walk in list order, ahead
  # of unstaged rows; inside a stage, rows keep file order. Names omit '#'.
  pre_stages: [terminal, periods, browser]
  post_stages: [periods]
  interval: 3 # Ready backlog review cadence
  pending_interval: 1 # [/] lane daily review; false = not walked
  next_interval: 1 # [*] lane daily review; false = not walked
  project_interval: 1 # Bryan's ^prj review cadence (personal setting, not a built-in default)
  # rotten_daily_budget: 15 # counts upkeep outside the lanes; never hides tasks
  # Task decay (bob-cli docs/freshness.md §2a): each rung allows N due Alt+F keeps, and
  # the next due keep opens the decay card. Enter steps one rung down (WIP → Next →
  # Ready → P1 → … → P4; never drops); Alt+F stays and restarts the count. Every keep,
  # stay, and step writes a 🥀 ROTTEN LOG entry. false = count and log, never ask.
  decay:
    pending_keeps: 2 # WIP [/] → Next
    next_keeps: 2 # Next [*] → Ready
    ready_keeps: 2 # Ready → P1, and each P-level → the next
    enter: P1 # unprioritized Ready tasks enter the ladder at P1

# Today's plan budget (`bob plan`, capture, tmux, Obsidian) and the NEXT/PENDING/READY
# lane caps; see `docs/plan.md` in bob-cli. The block is optional: a missing block
# means these defaults. Caps are integers >= 1; the lists hold non-empty
# strings. Invalid values fall back to the defaults with a warning everywhere
# except `bob plan`, which exits 2.
plan:
  max_links: 13 # distinct open Task Links outside exempt entries
  max_pending: 8 # [/] In Progress lane soft cap, shown as PENDING
  max_next: 13 # [*] Next lane soft cap (docs/plan.md)
  max_ready: 21 # soft limit for dashboard READY tasks, excluding Today
  exempt: [PLAN] # open entries that never count as themes
  inventory_labels: [LATER, MISC, NEW FEATURES] # open names that are storage, not themes
  default_type: CHORE # last-resort type for tasks without a more specific default

# Task relations (docs/task-relations.md §17 in bob-cli).
relations:
  # linked_from_lines: true   # write 🪢 LINKED FROM mirrors (default)
  # Committing a link with one of these labels also cancels the task the label
  # is phrased from ("S duplicate of T" cancels S). Matched like relation
  # labels (case, spacing, trailing colon ignored). Empty cancels nothing.
  cancel_labels:
    - duplicate of
    - superseded by
  # Committing a link with one of these labels also completes the task the label is
  # phrased from ("S implemented by T" completes S), exactly as Ctrl+Enter or capture
  # `!` would. Matched like cancel_labels. Empty completes nothing.
  complete_labels:
    - implemented by
    - verified by
  # Linking S with one of these labels to T offers S as a successor when T is
  # parked (left Pending, off today's plan) or done. Never blocks; S is never
  # auto-linked. Empty offers nothing.
  successor_labels:
    - starts after
  # A committed link with one of these labels merges its source into its
  # target. `>` uses the first configured label; an empty list disables
  # only relation-triggered merges.
  merge_labels: [merged into]

# Counted clipboard history (`bob capture %c<N>`; docs/capture.md §Clipboard
# in bob-cli). On macOS `%c<N>` reads only Alfred and refuses, naming Alfred,
# if Alfred stops tracking; a relaunched Clipy is never used. On Linux `%c<N>`
# still needs `BOB_CLIPBOARD_HISTORY_CMD`, which outranks this key. Older bob
# builds ignore unknown `capture` keys, so this is safe on every host.
capture:
  clipboard_history: alfred

# Task types: your vocabulary and its colors (docs/task-types.md PT12 in bob-cli).
# A name outside this list still works, but menus stop suggesting it and
# capture, bob plan, and the ledger mark it. Colors are palette slots (blue, orange,
# aqua, yellow, magenta, green, violet, red) or auto; they win over
# `bob themes color` pins. Colors were picked so the themes that share the most days
# sit in different hue families.
types:
  BUILD: yellow
  CHORE: magenta
  FIX: red
  MEET: blue
  PLAN: auto
  READ: green
  WRITE: violet
