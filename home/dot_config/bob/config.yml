# Bullet properties offered by the Obsidian "Set bullet property" picker (Ctrl+Shift+P).
# `values` is the literal string `date` (YYYY-MM-DD), the literal string `local_task_id`
# (the identifier of an open #task chosen from the current file), the literal string
# `priority` (a P-level that also rolls a random date into another date property), or a
# list of allowed values.
properties:
  - name: scheduled
    values: date
  - name: dependsOn
    values: local_task_id
  # Choosing a level writes `[priority:: <value>]` and rolls a random date into the
  # property named by `schedules`, drawn inclusively from that level's day window.
  # A task with no priority field is implicitly P0: do it now, no roll.
  #
  # `value` is what lands in the note and MUST stay one of Obsidian Tasks' priority
  # names (highest, high, medium, low, lowest). Tasks-format parsers read trailing
  # inline fields right to left and stop at the first one they do not recognize, so an
  # invented value such as `P2` would also hide every `[scheduled:: ]`, `[id:: ]`, and
  # `[dependsOn:: ]` field to its left from Obsidian Tasks, `bob query`, and the dash.
  # `label` is what the picker shows.
  - name: priority
    values: priority
    schedules: scheduled
    # Ctrl+Enter on `scheduled` takes the recommended roll. Each level allows `rolls`
    # same-level rolls (read from the task's Schedule Log); the next recommended roll
    # decays the task one level (P2 → P3), and past the last level it cancels it.
    # `decay: false` makes Ctrl+Enter a plain same-level roll that never decays.
    # decay:
    #   rolls: 1
    levels:
      - label: P1
        value: high
        min_days: 2
        max_days: 7
        # rolls: 3   # optional: this level's own roll limit
      - label: P2
        value: medium
        min_days: 8
        max_days: 30
      - label: P3
        value: low
        min_days: 31
        max_days: 90
      - label: P4
        value: lowest
        min_days: 91
        max_days: 365

highlights:
  pre_scan_hook: PATH="$HOME/bin:$PATH" bob_xlib_pull

# `bob gkeep` drains the Google Keep inbox into gkeep_inbox.md as Obsidian
# tasks; see `bob gkeep --help` and docs/gkeep.md in bob-cli. Run
# `bob gkeep login` once to store the master token, then `bob gkeep doctor`
# to diagnose the setup.
gkeep:
  email: bryanbugyi34@gmail.com
  # token_command: pass show gkeep/master_token
  # token_store_command: pass insert -m -f gkeep/master_token
  # device_id: 3f9c0a1b2c3d4e5f # optional hex; default derived from email
  # target: gkeep_inbox.md # optional; vault-relative
  # timeout_secs: 300 # optional adapter timeout

# Today's plan budget (`bob plan`, capture, tmux, Obsidian) and the weekly #now
# cap; see `docs/plan.md` in bob-cli. The block is optional: a missing block
# means these defaults. Caps are integers >= 1; the lists hold non-empty
# strings. Invalid values fall back to the defaults with a warning everywhere
# except `bob plan`, which exits 2.
plan:
  max_themes: 3 # distinct open Pomodoro names besides the exempt ones
  max_links: 10 # distinct open Task Links outside exempt entries
  max_now: 15 # open #now tasks visible today (see docs/plan.md)
  strict: false # refuse #NAME captures that would create a theme past max_themes
  exempt: [GTD] # open entries that never count as themes
  inventory_labels: [LATER, MISC, NEW FEATURES, SASE] # open names that are storage, not themes
