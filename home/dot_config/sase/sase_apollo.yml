id:
  username: bbugyi200
  machine_name: apollo

memory:
  h1_title: "apollo - Bryan Bugyi's Rendezvous Server"

# Host-owned service procs for this machine. Do not enable telegram_receiver
# here: Telegram allows one getUpdates consumer per bot, and the receiver runs
# on athena only. Likewise the telegram outbound routine lives only in
# sase_athena.yml, so no tg_outbound job runs on apollo.
service:
  procs:
    gateway:
      enabled: true
