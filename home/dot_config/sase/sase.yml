    research:
      icon: "∴"
      color: "#5FD7AF"
      description: "Research swarm agents from #research_swarm that ship durable reports instead of code changes."

axe:
  lumberjacks:
    telegram:
      description: |-
        Fast lane that relays Telegram messages and notification delivery every few seconds

        Runs every five seconds because chat buttons, slash commands, and outbound notifications are useful only when
        they feel near-real-time. Keep Telegram transport chops in this lane; broader notification maintenance belongs
        elsewhere so bot network calls do not delay unrelated work.

        The lumberjack supplies the bot username, chat id, and token environment to both chops. It intentionally avoids
        `run_every` delays so inbound decisions and outbound acknowledgements are checked on every tick.
      interval: 5
      env:
        SASE_TELEGRAM_BOT_USERNAME: sase_athena_bot
        SASE_TELEGRAM_BOT_CHAT_ID: "8990449281"
        SASE_TELEGRAM_BOT_TOKEN: { pass: telegram_sase_bot_token }
      chops:
        tg_inbound:
          script: sase_chop_tg_inbound
          description: |-
            Process Telegram inline keyboard responses and text messages

            Polls the bot API for callbacks, slash commands, chat text, and attachments, then writes the matching SASE
            response or launch request for core workflows to consume.

            This chop runs on every five-second tick so approvals and questions resolve quickly. It uses the
            lumberjack-level bot environment; Telegram launch-disabling policy can still block free-form agent starts
            without stopping callbacks or feedback responses.
        tg_outbound:
          script: sase_chop_tg_outbound
          description: |-
            Send unread notifications to Telegram

            Reads the same SASE notification store used by ACE, formats unread non-silent notifications for Telegram,
            and sends messages, PDFs, or generated images to the configured chat.

            The fast cadence keeps approval requests and completion notices visible without a daemon. Delivery state and
            rate-limit checks stay in the Telegram plugin, so repeated AXE ticks do not resend handled notifications.

llm_provider:
  default_effort: xhigh
  model_aliases:
    custom:
      research_a:
        model: codex/gpt-5.6-sol
        description: "Primary independent research-swarm researcher."
        bucket: researchers
      research_b:
        model: claude/opus
        description: "Assisting (second-opinion) research-swarm agents."
        bucket: researchers
      research_lead:
        model: "@smartest"
        description: "Final research-swarm lead and consolidator."
        bucket: researchers
    buckets:
      researchers:
        description: "Research-swarm model roles: primary researcher, second-opinion researcher, lead/consolidator."

xprompts:
  # keep-sorted start
  actstat:
    input:
      repo:
        type: word
        default: sase
        description: The name of the repo that is failing GitHub Actions.
    content: |-
      GitHub Actions is failing for the {{ repo }} repo. Can you run the `actstat` command to get more information about
      the failing jobs, diagnose the root cause of these failures, and then fix them?
  bd/review_tasks: |-
    #gh:sase Can you review all of the current task sase beads that are opened for
    the "sase" project? There are currently too many open task beads for me to
    review or approve right now. Can you help me complete the following sequence of
    steps to address this?:

    1. Select just seven that are definitely still relevant (or less if there are <7
       relevant open task beads) and will provide the highest impact once addressed.
    2. Close all of the other task beads with a good reason.
    3. Set some sase variables to express which tasks out of the seven are most
       important in ranked order.

    #m_opus
  bea:
    snippet: true
    content: "I want you to lead the design on this one. Just make sure it looks beautiful!"
  beau:
    snippet: true
    content:
      "I want you to lead the design on this one. Make sure you design this feature so it is intuitive, reliable, and
      (last but not least) beautiful!"
  codex3: "gpt-5.3-codex"
  codex: "gpt-5.6-sol"
  gh_dotfiles: "#gh:dotfiles"
  gh_sase: "#gh:sase"
  m_agy: "%model:agy/gemini-3.5-flash-high"
  m_agy_pro: "%model:agy/gemini-3.6-flash-high"
  m_agy_pro_flash: "%{%m:agy/gemini-3.6-flash-high | %m:agy/gemini-3.5-flash-high}"
  m_cheap: |-
    %m:@cheaper
  m_codex: "%model:#codex"
  m_fable: "%m:claude/claude-fable-5"
  m_flash: "#m_agy"
  m_opus: "%model:opus"
  m_opus_codex: "%{%m:opus | %m:#codex}"
  m_opus_sonnet: "%{%m:opus | %m:sonnet}"
  m_qwen: "%model:qwen3.6-plus"
  m_sonnet: "%model:sonnet"
  m_spark: "%model:codex/gpt-5.3-codex-spark"
  m_swarm: "%{%m:opus | %m:#codex | %m:agy/gemini-3.5-flash-high}"
  nvim:
    snippet: true
    content: "Neovim (my neovim config lives in my chezmoi repo)"
  perf:
    snippet: true
    content: "Make sure your solution doesn't harm performance at all."
  prs/compare:
    input:
      pr_a: int
      pr_b: int
      task_type: { type: line, default: "feature" }
    snippet: prs
    content: |
      Can you help me compare PR #{{ pr_a }} with PR #{{ pr_b }}? Both of these PRs implement the same {{ task_type }}.
      End your analysis with a recommendation on which PR you would recommend merging and why. Also, look for ways that
      that we could improve the accepted PR by integrating parts of the rejected PRs changes (if the PR has a better
      interface or better tests, for example). Do NOT attempt to merge the accepted PR or make any file changes. You job
      is analysis ONLY!
  rchat:
    snippet: true
    content: "Review recent, related sase agent chats for context."
  research/image: |
    Can you use GPT image to generate an infographic that illustrates the main points made in this research markdown
    file? Write the image to a new file in the same directory.
  research/more: |
    Can you help me improve this research markdown file by doing your own research and filling in any gaps missed by the
    previous agent? Preserve the existing file path unless I explicitly ask for a new file, and follow
    $(sase repo path research --ensure)/README.md conventions when present.
  research/prompt:
    input:
      prompt: text
    content: |
      Can you help me do some research on the below prompt? Investigate prior art, propose a few alternative solutions,
      and end your analysis with a recommended solution. #research

      ## THE PROMPT
      {{ prompt }}
  research: |
    Write this research to a new markdown file under the $(sase repo path research --ensure)/$(date +%Y%m)/ directory.
  tale: |-
    #plan %a:tale
  # keep-sorted end
