timezone: "America/New_York"
use_chezmoi: true
artifacts:
  retention:
    enabled: true
commit_hooks:
  before: "sase_git_fix"
file_hooks:
  - name: research-highlights
    description: Render new research reports into Highlights PDFs for the Obsidian reading queue.
    command: bob highlights create --include-id
    filters:
      sidecars: [research]
      path_globs: ["20*/**/*.md", "!20*/*/*__*.md"]
      agent_name_globs: ["!research.*.cld", "!research.*.cdx"]
      ops: [ADD]
    timeout: 120s
github_orgs:
  - bbugyi200
  - sase-org
  - bobs-org
repos:
  linked:
    - name: chezmoi
      path: ~/.local/share/chezmoi
      description: |-
        Chezmoi-managed dotfiles and global SASE configuration source. Use `sase repo open` to access a private linked
        workspace when running from a numbered host workspace.
