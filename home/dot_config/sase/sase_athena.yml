id:
  username: bbugyi200
  machine_name: athena

memory:
  h1_title: "athena - Bryan Bugyi's Home Server"

llm_provider:
  provider: codex
  model_aliases:
    custom:
      # GLM-5.2 pilot aliases. Effort MUST stay pinned to @high or @max: OpenCode
      # only generates `high` and `max` variants for GLM-5.2 and rejects any other
      # --variant, and the base config's default_effort is xhigh.
      glm52_high:
        model: opencode/zai/glm-5.2@high
        description: "GLM-5.2 via OpenCode on the metered Z.AI API (high effort)."
        bucket: glm_pilot
      glm52_max:
        model: opencode/zai/glm-5.2@max
        description: "GLM-5.2 via OpenCode on the metered Z.AI API (max effort)."
        bucket: glm_pilot
      glm52cp_high:
        model: opencode/zai-coding-plan/glm-5.2@high
        description: "GLM-5.2 via OpenCode on the Z.AI Coding Plan subscription (high effort)."
        bucket: glm_pilot
      glm52cp_max:
        model: opencode/zai-coding-plan/glm-5.2@max
        description: "GLM-5.2 via OpenCode on the Z.AI Coding Plan subscription (max effort)."
        bucket: glm_pilot
    buckets:
      glm_pilot:
        description: "GLM-5.2 pilot models routed through OpenCode. Not part of any built-in role pool."

telegram:
  commands:
    tasks:
      description: "📋 Obsidian tasks dashboard (WIP/NEXT/READY) as a PDF"
      run: tg_cmd_tasks
      output: pdf
      timeout: 90s

axe:
  lumberjacks:
    run_every:
      description: |-
        Propose scheduled maintenance for configured projects once a minute

        Runs every 60 seconds so low-cost maintenance checks can notice stale conditions without waiting for a slower
        audit lane. Use this lane for chores controlled mainly by `run_every` and AXE inhibit guards, not for
        commit-threshold reviews or documentation refreshes.

        The current chop targets only `sase` and is guarded by the `toobig-` clan prefix, so a previous split-file swarm
        must clear before another scan can propose work.
      interval: 60
      wait_runners: 3
      chops:
        toobig_split:
          script: bugyi_chop_toobig_split
          description: |-
            Propose split-file agents for oversized Python files in sase

            Runs `bugyi_chop_toobig_split` every 60 minutes for the `sase` target, scanning the configured `src` and
            `tests` trees with line limits `1000`, `850`, and `700`.

            The `toobig-` clan inhibit guard prevents overlapping split-file swarms. Each scan emits a sequential clan
            of content-deduped `%auto #split_file:<path>` proposals, so large files are handled one at a time.
          run_every: 60m
          inhibit_if:
            agent_clan: { name_prefix: toobig- }
          for_each:
            source: projects
            names: [sase]
          vars:
            trees: [src, tests]
            limits: ["1000", "850", "700"]
    refresh_docs:
      description: |-
        Refresh project documentation after meaningful repository drift

        Runs every 60 seconds so each project target can let `git.commits_since` decide when documentation has drifted
        enough to refresh. Documentation-only proposal chops belong here; quality audits and file-splitting maintenance
        stay in their own lanes.

        The current chop fans out across enabled projects and checkpoints only after the documentation agents succeed,
        which keeps failed refreshes eligible for a later tick.
      interval: 60
      wait_runners: 0
      chops:
        refresh_docs:
          script: sase_chop_refresh_docs
          description: |-
            Refresh documentation for enabled projects after meaningful repository drift

            Runs `sase_chop_refresh_docs` every three hours for each enabled project, but only after
            `git.commits_since` reports 100 commits since the last successful refresh.

            The chop emits an update proposal followed by a polish proposal that waits on the update.
            `checkpoint: on_action_success` keeps the commit window open until the documentation refresh actually lands.
          run_every: 3h
          trigger:
            git.commits_since:
              project: "{target.name}"
              threshold: 100
              checkpoint: on_action_success
          for_each:
            source: projects
    ci_watch:
      description: |-
        Watch GitHub Actions health across SASE repos and drive fixes or releases

        Runs every five minutes. The single chop owns its own actstat config so unrelated orgs are never swept,
        classifies high-cadence repos from terminal job evidence instead of blanket in-flight state, and proposes at
        most one debounced CI-fix agent per tick. Fix proposals are suppressed only while a `ci_fix` hood agent is live;
        `wait_runners: 0` delays a launched fixer until the machine is idle. The chop also guards release merges because
        no SASE repo has branch protection, publishes a durable current release report, and links release notifications
        directly to that report.
      interval: 300
      wait_runners: 0
      chop_timeout: "120s"
      chops:
        ci_watch:
          script: bugyi_chop_ci_watch
          description: |-
            Sweep actstat once, propose non-overlapping CI fixes, and merge ready release PRs

            Terminal job failures propose one sha-independent, deduplicated fix agent after the same failing job
            fingerprint survives the debounce window (suppressed while a `ci_fix` hood agent is live, one per tick);
            lane-level `wait_runners: 0` keeps launched fixers from competing with interactive work. Green branches
            with fully green release PRs merge deterministically in dependency order, capped per tick. Repos with no
            Actions report no_ci, while everything unknown fails closed. Every tick publishes the current release
            ledger report, and merge or blocked-release notifications open that live report in ACE.
          env:
            ACTSTAT_CONFIG: /home/bryan/.config/sase/actstat-ci-watch.yml
          vars:
            actstat_bin: /home/bryan/.cargo/bin/actstat
            gh_bin: gh
            sase_bin: sase
            repos: [sase-org/sase, sase-org/sase-core, sase-org/sase-github, sase-org/sase-telegram, sase-org/sase-nvim]
            release_repositories:
              sase-org/sase: release-please
              sase-org/sase-core: release-plz
              sase-org/sase-github: release-please
              sase-org/sase-telegram: release-please
            merge_order: [sase-core, sase-github, sase-telegram, sase]
            max_merges_per_tick: 1
            max_fix_proposals_per_tick: 1
            red_debounce_ticks: 2
            fix_enabled: true
            merge_enabled: true
