# Host policy for nut. Hardware knowledge lives in UPS and board profiles.
# This file contains no secrets.
schema = 1

[host]
name = "athena"

[ups.cp1500]
profile = "cyberpower-cp1500pfclcd"
description = "CyberPower CP1500PFCLCD"
port = "auto"

[ups.cp1500.match]
vendorid = "0764"
productid = "0601"

[ups.cp1500.extra]
maxretry = 3
retrydelay = 5

[shutdown]
notify_after = "30s"
early_after = "3m"
poweroff_wait = "30m"
shutdown_budget = "2m"

[notify]
from = "root@example.invalid"
to = "ops@example.invalid"
commbad_after = "60s"

[boot]
nofail_mounts = []
board_profile = "asus-prime-trx40-pro"

[operators]
users = []
journal = false

# [battery]
# installed = "YYYY-MM-DD"
