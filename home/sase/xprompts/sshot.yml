description:
  Reference a recent MacBook screenshot (local, apollo, or athena) as an inline @image.

input:
  - name: n
    type: int
    default: 1
    description:
      Which screenshot to fetch, counting back from the newest (1 = most recent).

steps:
  - name: fetch
    hidden: true
    bash: |
      n="{{ n }}"
      sshot_fetch "$n"
    output: { local_path: path }

  - name: inject
    prompt_part: |
      @file:{{ fetch.local_path }}
